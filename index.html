<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">

    <title>Disco do Professor</title>
</head>

<body>
    <header class="site-header">
        <h1>Disco do Professor</h1>
    </header>

    <div class="record-scene">
        <div class="record" aria-label="Disco de música girando">
            <div class="record-inner">
                <a href="./readme.html" aria-label="Abrir página do projeto">
                    <img id="img" src="img/cabeca.jpg" alt="Cabeça girando dentro do disco">
                </a>
            </div>
            <div class="record-center"></div>
        </div>

        <button id="toggle-spin" class="toggle-spin" type="button" aria-label="Pausar ou iniciar rotação do disco">
            Pausar
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
